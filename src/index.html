<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Crextio Login Page">
    <meta name="author" content="Login Page">
    <title>Crextio Login Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg" href="crextia-favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <button class="first-button">Crextia</button>

    <h1>Create an account</h1>
    <span>Sign up and get 30 day free trial</span>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="fname">Full Name</label><br>
                <input type="text" id="fname" name="fname" placeholder="John Doe"><br>
            </div>

            <div class="form-group"> 
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" placeholder="name@example.com"><br>
            </div>

            <div class="form-group">
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" placeholder="At least 8 characters"><br>
            </div>

            <button type="submit" class="btn">Submit</button>

            <!--Social Button container-->
            <div class="social-buttons">

                <button class="social-button">

                    <img src="apple.svg" alt="Apple">
                    Apple
                </button>

                <button class="social-button">
                    <img src="google-icon.svg" alt="Google">
                    Google

                </button>
            </div>

        </form>
    </div>

    <p>
        Have any account?
        <a href="#">Sign in</a>
        <a class="txt" href="#">Terms & Conditions</a>
    </p>



</body>

</html>
