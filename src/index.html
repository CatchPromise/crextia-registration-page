<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crextio Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <button class="first-button">Crextia</button>
    
    <h1>Create an account</h1>
    <span>Sign up and get 30 day free trial</span>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="fname">Full Name</label><br>
                <input type="text" id="fname" name="fname"><br>
            </div>

            <div class="form-group">
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"><br>
            </div>

            <div class="form-group">
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password"><br>
            </div>

            <button type="submit" class="btn">Submit</button>

            <!--Social Button container-->
            <div class="social-buttons">

                <button class="social-button">

                    <img src="Apple.jpeg" alt="Apple">
                    Apple
                </button>

                <button class="social-button">
                    <img src="Google.jpeg" alt="Google">
                    Google

                </button>
            </div>

        </form>
    </div>

    <div class="hero-image-container">
        <div class="hero-image">
            <img src="bigimage.jpg" alt="big-image">
        </div>
    </div>

</body>

</html>
